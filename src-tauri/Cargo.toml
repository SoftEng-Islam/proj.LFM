[package]
name = "lfm"
version = "0.4.0"
description = "LFM desktop shell built with Tauri and Rust"
default-run = "lfm"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version= "2", features = [] }

[dependencies]
sysinfo = "0.23"
serde_json = "1"
serde = { version = "^1.0", features = ["derive"] }
toml = "0.7"
tauri = { version= "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"
open = "2"
path-absolutize = "3"
trash = "2"
notify = "4"
normpath = "0.3"
lazy_static = "1.4"
font-loader = "0.11"
clap = "3.0.14"
glob = "0.3"
parselnk = "0.1"
url = "2.2"
reqwest = "0.11"
tokio = { version = "^1", features = ["macros", "parking_lot", "rt", "process"] }
bincode = "1.3"
dirs = "5"
zip = "0.6.2"
thiserror = "1"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.11.0"
hex = "0.4.3"
image = "0.25"

[target."cfg(any(target_os = \"windows\", target_os = \"macos\"))".dependencies]
window-vibrancy = { git = "https://github.com/tauri-apps/window-vibrancy" }
window-shadows = { git = "https://github.com/tauri-apps/window-shadows" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
