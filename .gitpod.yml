---
image:
    file: Dockerfile

tasks:
    - name: pnpm install
      init: corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install
      command: gp sync-done pnpm-install
    - name: LFM App Server
      init: echo "Starting app server"
      command: |
          gp sync-await pnpm-install &&
          pnpm run dev

vscode:
    extensions:
        - softeng.jsdoc-generator

        - esbenp.prettier-vscode

        - orta.vscode-jest

# Ports config
ports:
    - port: 1420
      onOpen: open-preview
    - port: 6080
      onOpen: open-browser
    - port: 5900
      onOpen: ignore

# GitHub Prebuilds
github:
    prebuilds:
        master: true
        branches: true
        pullRequests: true
        pullRequestsFromForks: true
        addComment: false
        addBadge: true
        addLabel: prebuilt-in-gitpod
