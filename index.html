<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- <link rel="preload" href="/fonts/karla-regular.woff2" as="font" type="font/woff2" crossorigin /> -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="LFM is a Linux-first desktop file manager built with Vue, TypeScript, Rust, Tauri, Tailwind CSS, and Sass."
		/>
		<title>LFM</title>
		<script>
			// Set theme based on system or saved theme
			(function () {
				try {
					const savedTheme = localStorage.getItem('theme'); // 'system', 'light' nebo 'dark'
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; // true or false
					const theme = savedTheme || (prefersDark ? 'dark' : 'light'); // 'light' or 'dark'
					document.documentElement.setAttribute('data-theme', theme); // save theme to html tag
				} catch (e) {
					console.error('Error setting theme:', e);
				}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
